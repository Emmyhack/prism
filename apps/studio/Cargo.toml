[package]
name = "prism-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
prism-commands = { path = "../../crates/prism-commands" }
prism-media = { path = "../../crates/prism-media" }
prism-persistence = { path = "../../crates/prism-persistence" }
prism-recipe = { path = "../../crates/prism-recipe" }
prism-script = { path = "../../crates/prism-script" }
serde.workspace = true
serde_json.workspace = true
slint = "1.18.1"
thiserror.workspace = true

[build-dependencies]
slint-build = "1.18.1"

[lints.rust]
# Slint's generated item-tree code contains audited unsafe implementation
# details. Hand-written Prism code remains free of unsafe blocks.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
