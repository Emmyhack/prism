[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-python-sdk"
version = "0.1.0"
description = "Python authoring SDK for Prism's versioned editing protocol"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["video-editing", "timeline", "prism"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[tool.setuptools.package-data]
prism = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
