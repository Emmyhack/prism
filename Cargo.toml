[workspace]
resolver = "3"
members = [
    "apps/cli",
    "apps/studio",
    "crates/prism-core",
    "crates/prism-project",
    "crates/prism-media",
    "crates/prism-persistence",
    "crates/prism-timeline",
    "crates/prism-commands",
    "crates/prism-script",
    "crates/prism-testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Prism contributors"]
repository = "https://github.com/prism-editor/prism"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
proptest = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
