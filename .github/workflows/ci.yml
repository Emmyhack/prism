name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1-dev libxkbcommon-dev
      - name: Install macOS media runtime
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install Windows media runtime
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Real media tests
        env:
          PRISM_FFMPEG: ffmpeg
          PRISM_FFPROBE: ffprobe
          PRISM_TEST_FFMPEG: "1"
        run: cargo test --workspace --all-targets --all-features --locked -- --ignored
      - name: Release build
        run: cargo build --release --locked -p prism-studio -p prism-cli

  macos-package:
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-macos.sh
      - name: Validate macOS package
        run: |
          plutil -lint "dist/Prism Studio.app/Contents/Info.plist"
          codesign --verify --deep --strict "dist/Prism Studio.app"
          unzip -t dist/Prism-Studio-*-macos.zip
          (cd dist && shasum -a 256 -c Prism-Studio-*-macos.zip.sha256)
          "dist/Prism Studio.app/Contents/Resources/bin/prism-cli" --help
      - uses: actions/upload-artifact@v4
        with:
          name: prism-studio-macos-unsigned
          path: |
            dist/Prism-Studio-*-macos.zip
            dist/Prism-Studio-*-macos.zip.sha256
          if-no-files-found: error

  linux-package:
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: ./scripts/package-linux.sh
      - name: Validate Linux package
        run: |
          tar -tzf dist/Prism-Studio-*-linux-*.tar.gz
          (cd dist && sha256sum -c Prism-Studio-*-linux-*.tar.gz.sha256)
          dist/Prism-Studio-*-linux-*/bin/prism-cli --help
          test -s dist/Prism-Studio-*-linux-*/share/licenses/prism-studio/THIRD_PARTY_NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: prism-studio-linux-unsigned
          path: |
            dist/Prism-Studio-*-linux-*.tar.gz
            dist/Prism-Studio-*-linux-*.tar.gz.sha256
          if-no-files-found: error

  windows-package:
    runs-on: windows-2025
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-windows.ps1
      - name: Validate Windows package
        shell: pwsh
        run: |
          $Archive = Get-ChildItem dist/Prism-Studio-*-windows-*.zip | Select-Object -First 1
          if (-not $Archive) { throw "Windows package archive missing" }
          $ExpectedHash = ((Get-Content "$($Archive.FullName).sha256") -split '\s+')[0]
          $ActualHash = (Get-FileHash -Algorithm SHA256 $Archive.FullName).Hash.ToLowerInvariant()
          if ($ExpectedHash -ne $ActualHash) { throw "Windows package checksum mismatch" }
          $Cli = Get-ChildItem dist/Prism-Studio-*-windows-*/bin/prism-cli.exe | Select-Object -First 1
          & $Cli.FullName --help
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI smoke test failed" }
          $Notices = Get-ChildItem dist/Prism-Studio-*-windows-*/licenses/THIRD_PARTY_NOTICES.txt | Select-Object -First 1
          if (-not $Notices -or $Notices.Length -eq 0) { throw "Third-party notices missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: prism-studio-windows-unsigned
          path: |
            dist/Prism-Studio-*-windows-*.zip
            dist/Prism-Studio-*-windows-*.zip.sha256
          if-no-files-found: error
